<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mars mission plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@500&family=Chakra+Petch:wght@600&family=Manrope:wght@300;400;600&display=swap">
<style>
:root{
  --surface:#0e0e0e; --raised:#171717; --input:#1f1f1f; --input-hover:#2b2b2b; --tint:#231713;
  --border:#2b2b2b; --border-strong:#706e68; --signal:#e5522c; --focus:#f2c14e;
  --text:#e8e4d8; --display:#ddd6c5; --muted:#9a968c; --accent:#e5522c; --on-signal:#0e0e0e;
  --live:#3e8fc6; --success:#6fbf73; --warning:#f2c14e; --danger:#ff7a59;
  --warn-fill:rgba(242,193,78,.14); --live-fill:rgba(62,143,198,.1);
  --grid:#2b2b2b; --axis:#4d4c49; --s1:#e5522c; --s2:#3e8fc6; --s3:#bd891c; --s4:#018d82; --mutedmark:#706e68;
  --body:"Manrope",sans-serif; --ui:"Chakra Petch",sans-serif; --mono:"Azeret Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--text);font:400 16px/1.5 var(--body)}
.page{max-width:1280px;margin:0 auto;padding:48px 16px 96px}
.eyebrow{font:600 13px/1.2 var(--ui);letter-spacing:2.08px;text-transform:uppercase;color:var(--accent);margin:0 0 16px}
h1{font:300 49px/1.05 var(--body);letter-spacing:-.49px;color:var(--display);margin:0 0 16px}
h2{font:400 25px/1.2 var(--body);color:var(--display);margin:0 0 8px}
.lead{font:400 20px/1.5 var(--body);max-width:840px;margin:0 0 32px}
p{max-width:70ch;margin:0 0 16px}
.muted,.note{color:var(--muted);font-size:13px;line-height:1.4}
.label{font:600 13px/1.2 var(--ui);letter-spacing:1.56px;text-transform:uppercase;color:var(--muted)}
.num{font:500 13px/1.4 var(--mono);font-variant-numeric:tabular-nums}
section{margin-top:64px}
.card{background:var(--raised);border:1px solid var(--border);border-radius:12px;padding:24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tile{background:var(--raised);border:1px solid var(--border);border-left:3px solid var(--signal);border-radius:12px;padding:16px 16px 16px 20px}
.tile .v{font:300 39px/1.1 var(--body);letter-spacing:-.78px;color:var(--display);margin-top:8px;font-variant-numeric:tabular-nums}
.tile .v small{font:400 16px/1 var(--body);color:var(--muted);letter-spacing:0;margin-left:6px}
.tile .s{color:var(--muted);font-size:13px;margin-top:4px}
.orbit{display:grid;grid-template-columns:minmax(320px,560px) 1fr;gap:32px;align-items:start}
@media (max-width:900px){.orbit{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--body);fill:var(--muted);font-size:12px}
.readout{display:grid;grid-template-columns:auto 1fr;gap:8px 24px;align-items:baseline;margin:16px 0 24px}
.readout dt{color:var(--muted);font-size:13px}
.readout dd{margin:0;font:500 13px/1.4 var(--mono);font-variant-numeric:tabular-nums}
.now{font:400 31px/1.2 var(--body);letter-spacing:-.62px;color:var(--display);font-variant-numeric:tabular-nums}
.controls{display:flex;gap:16px;align-items:center;margin-top:16px}
input[type=range]{flex:1;accent-color:var(--signal);height:24px}
button{font:600 13px/1.2 var(--ui);letter-spacing:1.04px;text-transform:uppercase;border-radius:12px;padding:12px 16px;cursor:pointer;
  background:var(--input);color:var(--text);border:1px solid var(--border-strong)}
button:hover{background:var(--input-hover)}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tag{display:inline-flex;gap:6px;align-items:center;font:600 13px/1.2 var(--ui);letter-spacing:1.04px;text-transform:uppercase;border-radius:6px;padding:4px 8px}
.tag.ok{background:rgba(111,191,115,.15);color:var(--success)}
.tag.warn{background:var(--warn-fill);color:var(--warning)}
.tag.bad{background:rgba(229,82,44,.15);color:var(--danger)}
.tag.info{background:var(--live-fill);color:var(--live)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 13px/1.2 var(--ui);letter-spacing:1.04px;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:right;font:500 13px/1.4 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.sel td{background:var(--tint)}
tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--signal)}
.scroll{overflow-x:auto}
.chartwrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--input);border:1px solid var(--border-strong);border-radius:6px;padding:8px 12px;font-size:13px;line-height:1.4;display:none;white-space:nowrap;z-index:5}
.tip b{font:500 13px/1.4 var(--mono);color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:8px 24px;margin:8px 0 0;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stack{display:grid;gap:16px}
ul{margin:0;padding-left:20px;max-width:75ch}
li{margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="page" id="app"></div>
<script>
const D = /*__DATA__*/null;
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})) { if (k === "class") e.className = attrs[k]; else if (k === "text") e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;

  const e = document.createElementNS(NS, tag);
  for (const k in (attrs||{})) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;

const fmtDate = d => new Date(d + "T00:00:00Z").toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric", timeZone:"UTC"});
const P = D.plan, C = D.calendar;
const PHASE = {prelaunch:"On Earth, before launch", outbound:"Outbound transit", surface:"Mars surface", return:"Return transit", recovery:"Back on Earth"};
const PHASE_COLOR = {outbound:"var(--s2)", surface:"var(--s1)", return:"var(--s4)"};
const app = document.getElementById("app");

/* ---------- header ---------- */
app.append(
  el("p", {class:"eyebrow", text:"Mission plan · planning study"}),
  el("h1", {text:P.name}),
  el("p", {class:"lead", text:`Launch ${fmtDate(P.launch_utc)}, land ${fmtDate(P.mars_arrival_utc)}, ${P.surface_sols} sols at ${P.landing_site.name}, leave ${fmtDate(P.mars_departure_utc)}, home ${fmtDate(P.earth_return_utc)}.`})
);
const tiles = el("div", {class:"tiles"});
function tile(label, v, unit, sub){
  const vv = el("div", {class:"v", text:v}); if (unit) vv.append(el("small", {text:unit}));
  tiles.append(el("div", {class:"tile"}, el("div", {class:"label", text:label}), vv, el("div", {class:"s", text:sub})));
}
tile("Whole mission", P.total_days, "days", (P.total_days/365.25).toFixed(1) + " years away from Earth");
tile("In deep space", P.deep_space_days, "days", `${P.outbound_days} out + ${P.return_days} back, weightless`);
tile("On Mars", P.surface_days, "days", `${P.surface_sols} sols at 0.38 g`);
tile("Longest light delay", P.communication.max_one_way_light_min.toFixed(1), "min", `one way, on ${fmtDate(P.communication.max_light_date)}`);
tile("No contact", P.communication.conjunction_blackout.blackout_days, "days", `Sun between Earth and Mars, from ${fmtDate(P.communication.conjunction_blackout.blackout_first)}`);
app.append(tiles);

/* ---------- orbit view with time slider ---------- */
const sec1 = el("section");
sec1.append(el("h2", {text:"Where everyone is, day by day"}),
  el("p", {class:"muted", text:"View from above the Solar System. Drag the slider to any mission day: the line between the ship and Earth is the path a radio message travels."}));
const W = 560, R = 1.74, SC = W / (2 * R);
const X = x => (x + R) * SC, Y = y => (R - y) * SC;
const svg = s("svg", {viewBox:`0 0 ${W} ${W}`, role:"img", "aria-label":"Orbit diagram of Earth, Mars and the spacecraft"});
const pathOf = pts => pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
svg.append(s("path", {d:pathOf(D.orbit_earth) + "Z", fill:"none", stroke:"var(--axis)", "stroke-width":1}));
svg.append(s("path", {d:pathOf(D.orbit_mars) + "Z", fill:"none", stroke:"var(--axis)", "stroke-width":1}));
svg.append(s("path", {d:pathOf(D.track_out), fill:"none", stroke:"var(--s2)", "stroke-width":2, "stroke-dasharray":"2 5", "stroke-linecap":"round"}));
svg.append(s("path", {d:pathOf(D.track_ret), fill:"none", stroke:"var(--s4)", "stroke-width":2, "stroke-dasharray":"2 5", "stroke-linecap":"round"}));
svg.append(s("circle", {cx:X(0), cy:Y(0), r:9, fill:"var(--warning)"}));
svg.append(s("text", {x:X(0) + 14, y:Y(0) + 4}, "Sun"));
const link = s("line", {stroke:"var(--text)", "stroke-width":1, "stroke-dasharray":"4 4", opacity:.7});
const linkLabel = s("text", {"text-anchor":"middle", style:"fill:var(--text);font-family:var(--mono);font-size:12px;paint-order:stroke;stroke:var(--raised);stroke-width:5px"});
const dotE = s("circle", {r:7, fill:"var(--live)", stroke:"var(--surface)", "stroke-width":2});
const dotM = s("circle", {r:6, fill:"var(--s1)", stroke:"var(--surface)", "stroke-width":2});
const dotS = s("circle", {r:4.5, fill:"var(--text)", stroke:"var(--surface)", "stroke-width":2});
const labE = s("text", {}, "Earth"), labM = s("text", {}, "Mars"), labS = s("text", {style:"fill:var(--text)"}, "Ship");
svg.append(link, linkLabel, dotE, dotM, dotS, labE, labM, labS);
const now = el("div", {class:"now"});
const phaseTag = el("span", {class:"tag info"});
const rd = el("dl", {class:"readout"});
const fields = {};
for (const [k, t] of [["day","Mission day"],["sol","Sol on Mars"],["dist","Distance to Earth"],["lt","Light delay, one way"],["rt","Question and answer"],["comm","Radio link"],["season","Mars season"],["g","Gravity"]]) {
  fields[k] = el("dd"); rd.append(el("dt", {text:t}), fields[k]);
}
const slider = el("input", {type:"range", min:0, max:C.length - 1, value:0, "aria-label":"Mission day"});
const play = el("button", {text:"Play"});
const side = el("div", {}, now, el("div", {style:"margin-top:8px"}, phaseTag), rd, el("div", {class:"controls"}, play, slider),
  el("div", {class:"legend"},
    el("span", {}, el("i", {style:"background:var(--live)"}), "Earth"), el("span", {}, el("i", {style:"background:var(--s1)"}), "Mars"),
    el("span", {}, el("i", {style:"background:var(--s2)"}), "Outbound path"), el("span", {}, el("i", {style:"background:var(--s4)"}), "Return path")));
sec1.append(el("div", {class:"card orbit"}, el("div", {}, svg), side));
app.append(sec1);

function place(lab, x, y, dx, dy){ lab.setAttribute("x", X(x) + dx); lab.setAttribute("y", Y(y) + dy); }
function show(i){
  const c = C[i], e = D.pos_earth[i], m = D.pos_mars[i], sp = D.pos_ship[i];
  dotE.setAttribute("cx", X(e[0])); dotE.setAttribute("cy", Y(e[1]));
  dotM.setAttribute("cx", X(m[0])); dotM.setAttribute("cy", Y(m[1]));
  dotS.setAttribute("cx", X(sp[0])); dotS.setAttribute("cy", Y(sp[1]));
  place(labE, e[0], e[1], 12, -8); place(labM, m[0], m[1], 12, -8);
  const away = c.phase === "outbound" || c.phase === "surface" || c.phase === "return";
  const inFlight = c.phase === "outbound" || c.phase === "return";
  dotS.style.display = inFlight ? "" : "none"; labS.style.display = inFlight ? "" : "none";
  place(labS, sp[0], sp[1], 10, 16);
  link.style.display = linkLabel.style.display = away && c.light_time_min > 0.2 ? "" : "none";
  link.setAttribute("x1", X(e[0])); link.setAttribute("y1", Y(e[1])); link.setAttribute("x2", X(sp[0])); link.setAttribute("y2", Y(sp[1]));
  linkLabel.setAttribute("x", (X(e[0]) + X(sp[0])) / 2); linkLabel.setAttribute("y", (Y(e[1]) + Y(sp[1])) / 2 - 6);
  linkLabel.textContent = c.light_time_min.toFixed(1) + " min";
  now.textContent = fmtDate(c.date_utc);
  phaseTag.textContent = PHASE[c.phase];
  fields.day.textContent = c.mission_day < 0 ? `L−${-c.mission_day}` : `${c.mission_day} of ${P.total_days}`;
  fields.sol.textContent = c.sol === "" ? "–" : `${c.sol} of ${P.surface_sols}`;
  fields.dist.textContent = away ? `${(c.dist_earth_au * 149.5978707).toFixed(1)} million km (${c.dist_earth_au.toFixed(2)} AU)` : "–";
  fields.lt.textContent = away ? `${c.light_time_min.toFixed(1)} min` : "–";
  fields.rt.textContent = away ? `${c.round_trip_min.toFixed(1)} min minimum` : "live";
  fields.comm.textContent = "";
  if (away) fields.comm.append(el("span", {class:"tag " + (c.comm === "ok" ? "ok" : c.comm === "degraded" ? "warn" : "bad"),
    text: c.comm === "ok" ? "✓ open" : c.comm === "degraded" ? "▲ degraded near the Sun" : "✕ no contact (conjunction)"}));
  else fields.comm.textContent = "–";
  fields.season.textContent = `Ls ${c.mars_ls_deg.toFixed(0)}° · ${c.mars_season}`;
  fields.g.textContent = c.gravity_g === 0 ? "weightless" : c.gravity_g + " g";
}
slider.addEventListener("input", () => show(+slider.value));
let timer = null;
play.addEventListener("click", () => {
  if (timer) { clearInterval(timer); timer = null; play.textContent = "Play"; return; }
  if (+slider.value >= C.length - 1) slider.value = 0;
  play.textContent = "Pause";
  timer = setInterval(() => { slider.value = Math.min(C.length - 1, +slider.value + 3); show(+slider.value);
    if (+slider.value >= C.length - 1) { clearInterval(timer); timer = null; play.textContent = "Play"; } }, 40);
});
slider.value = C.findIndex(c => c.phase === "surface") + 8; show(+slider.value);

/* ---------- generic line chart ---------- */
function lineChart(o){

  }

    g.append(s("text", {x:x(t.i), y:h - 12, "text-anchor":"middle"}, t.label));
  }
  g.append(s("line", {x1:m.l, x2:w - m.r, y1:m.t + ih, y2:m.t + ih, stroke:"var(--axis)"}));

    let d = "", pen = false;

    g.append(s("path", {d, fill:"none", stroke:se.color, "stroke-width":2, "stroke-linejoin":"round", "stroke-dasharray":se.dash || ""}));

  }

  const dots = o.series.map(se => s("circle", {r:4, fill:se.color, stroke:"var(--surface)", "stroke-width":2, style:"display:none"}));
  g.append(cross, ...dots);
  const tip = el("div", {class:"tip"});
  const wrap = el("div", {class:"chartwrap"}, g, tip);
  g.addEventListener("mousemove", ev => {
    const r = g.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * w;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - m.l) / iw * (n - 1))));
    cross.style.display = ""; cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i));
    tip.textContent = ""; tip.append(el("div", {class:"muted", text:o.tipHead(i)}));
    o.series.forEach((se, k) => {
      const v = se.values[i];
      dots[k].style.display = v == null ? "none" : "";
      if (v != null) { dots[k].setAttribute("cx", x(i)); dots[k].setAttribute("cy", y(v));
        const row = el("div", {}); row.append(el("b", {text:(o.vfmt ? o.vfmt(v) : v) + " "}), se.name); tip.append(row); }
    });
    if (o.tipExtra) { const t = o.tipExtra(i); if (t) tip.append(el("div", {class:"muted", text:t})); }
    tip.style.display = "block";
    const left = x(i) / w * r.width;
    tip.style.left = Math.min(Math.max(left + 14, 0), r.width - tip.offsetWidth - 4) + "px";

}
const idx = pred => { const a = C.findIndex(pred); let b = a; while (b + 1 < C.length && pred(C[b + 1])) b++; return [a, b]; };
function yearTicks(dates){ const t = []; dates.forEach((d, i) => { if (d.slice(5) === "01-01" || d.slice(5) === "07-01") t.push({i, label: d.slice(5) === "01-01" ? d.slice(0, 4) : "Jul"}); }); return t; }

/* ---------- light delay ---------- */
const sec2 = el("section");
sec2.append(el("h2", {text:"Light delay to Earth across the mission"}),
  el("p", {class:"muted", text:"Minutes a message needs one way. A question and its answer take at least twice as long, so the crew must handle emergencies without waiting for Earth."}));
const [o0, o1] = idx(c => c.phase === "outbound"), [s0, s1] = idx(c => c.phase === "surface"), [r0, r1] = idx(c => c.phase === "return");
const [b0, b1] = idx(c => c.comm === "blackout"), [g0, g1] = idx(c => c.comm === "blackout" || c.comm === "degraded");
sec2.append(el("div", {class:"card"}, lineChart({
  title:"One-way light delay in minutes", xs:C.map(c => c.date_utc), y0:0, y1:24, yticks:[0, 5, 10, 15, 20], yfmt:v => v + " min",
  xticks:yearTicks(C.map(c => c.date_utc)),
  bands:[{i0:o0, i1:o1 + 1, fill:"var(--s2)", opacity:.07, label:`Outbound · ${P.outbound_days} d`},
         {i0:s0, i1:s1, fill:"var(--s1)", opacity:.06, label:`Mars surface · ${P.surface_days} d`},
         {i0:r0 - 1, i1:r1 + 1, fill:"var(--s4)", opacity:.08, label:`Return · ${P.return_days} d`},
         {i0:g0, i1:g1, fill:"var(--warning)", opacity:.14}, {i0:b0, i1:b1, fill:"var(--warning)", opacity:.35}],
  series:[{name:"one way", color:"var(--text)", values:C.map(c => c.phase === "prelaunch" || c.phase === "recovery" ? null : c.light_time_min)}],
  vfmt:v => v.toFixed(1) + " min", tipHead:i => `${fmtDate(C[i].date_utc)} · ${PHASE[C[i].phase]}${C[i].sol !== "" ? " · sol " + C[i].sol : ""}`,
  tipExtra:i => C[i].comm === "blackout" ? "No contact: Sun in the way" : C[i].comm === "degraded" ? "Link degraded near the Sun" : ""
}), el("div", {class:"legend"},
  el("span", {}, el("i", {style:"background:var(--warning);opacity:.5"}), `▲ Solar conjunction: link degraded ${P.communication.conjunction_blackout.degraded_days} days, no contact ${P.communication.conjunction_blackout.blackout_days} days (${fmtDate(P.communication.conjunction_blackout.blackout_first)} – ${fmtDate(P.communication.conjunction_blackout.blackout_last)})`))));
app.append(sec2);

/* ---------- solar cycle (optional) ---------- */
if (D.solar && D.solar.dates && D.solar.dates.length) {
  const S = D.solar, sec = el("section"), COL = {text:"var(--text)", s2:"var(--s2)", s4:"var(--s4)"};
  sec.append(el("h2", {text:"Solar activity and the mission"}), el("p", {class:"muted", text:S.note}));
  const i0 = S.dates.indexOf(P.launch_utc.slice(0, 7)), i1 = S.dates.indexOf(P.earth_return_utc.slice(0, 7));
  const ticks = []; S.dates.forEach((d, i) => { if (d.slice(5, 7) === "01" && (+d.slice(0, 4)) % 5 === 0) ticks.push({i, label:d.slice(0, 4)}); });
  sec.append(el("div", {class:"card"}, lineChart({
    title:"Smoothed sunspot number", xs:S.dates, y0:0, y1:S.ymax, yticks:S.yticks, xticks:ticks,
    bands:i0 >= 0 && i1 >= 0 ? [{i0, i1, fill:"var(--s1)", opacity:.16, label:"Mission"}] : [],
    series:S.series.map(x => ({name:x.name, color:COL[x.color] || "var(--text)", dash:x.dash, values:x.values})),
    vfmt:v => v.toFixed(0), tipHead:i => S.dates[i]
  }), el("div", {class:"legend"}, ...S.series.map(x => el("span", {}, el("i", {style:"background:" + (COL[x.color] || "var(--text)")}), x.name)),
    el("span", {}, el("i", {style:"background:var(--s1);opacity:.5"}), "Mission"))));
  app.append(sec);
}

/* ---------- windows ---------- */
const sec3 = el("section");
sec3.append(el("h2", {text:"Which launch year? Same rocket, different sky"}),
  el("p", {class:"muted", text:D.caps_note + " Fewer days in deep space means less radiation and less time weightless."}));
const A = P.alternatives, maxDeep = Math.max(...A.map(a => a.deep_space_days));
const bw = 1200, rowH = 34, bh = A.length * rowH + 30, bx0 = 150, bx1 = bw - 150;
const bars = s("svg", {viewBox:`0 0 ${bw} ${bh}`, role:"img", "aria-label":"Days in deep space by launch window"});
const btip = el("div", {class:"tip"});
A.forEach((a, k) => {
  const yy = 8 + k * rowH, len = (a.deep_space_days / maxDeep) * (bx1 - bx0), sel = a.launch === P.launch_utc;
  bars.append(s("text", {x:bx0 - 12, y:yy + 17, "text-anchor":"end", style:sel ? "fill:var(--text)" : ""}, `${a.window} · launch ${a.launch.slice(0, 7)}`));
  const rect = s("path", {d:`M${bx0} ${yy}h${len - 4}a4 4 0 0 1 4 4v${rowH - 18}a4 4 0 0 1 -4 4h${-(len - 4)}z`, fill:sel ? "var(--s1)" : "var(--mutedmark)"});
  bars.append(rect);
  bars.append(s("text", {x:bx0 + len + 8, y:yy + 17, style:"fill:var(--text);font-family:var(--mono)"}, `${a.deep_space_days} d`));
  const hit = s("rect", {x:0, y:yy - 4, width:bw, height:rowH, fill:"transparent"});
  hit.addEventListener("mousemove", ev => { const r = bars.getBoundingClientRect();
    btip.textContent = ""; btip.append(el("div", {class:"muted", text:`Launch window ${a.window}`}),
      el("div", {}, el("b", {text:`${a.outbound_days} d `}), "out · ", el("b", {text:`${a.surface_days} d `}), "on Mars · ", el("b", {text:`${a.return_days} d `}), "back"),
      el("div", {}, el("b", {text:`${a.total_days} d `}), "in total"));
    btip.style.display = "block"; btip.style.left = Math.min(ev.clientX - r.left + 14, r.width - btip.offsetWidth - 4) + "px"; btip.style.top = (ev.clientY - r.top + 12) + "px"; });
  hit.addEventListener("mouseleave", () => btip.style.display = "none");
  bars.append(hit);
});
bars.append(s("text", {x:bx0, y:bh - 6}, "Days in deep space (outbound + return), shortest transfers the assumed rocket allows"));
sec3.append(el("div", {class:"card"}, el("div", {class:"chartwrap"}, bars, btip)));
const tb = el("table"), hd = el("tr");
["Window","Launch","Land","Leave Mars","Home","Out d","Mars d","Back d","Total d","Deep space d","Earth entry km/s"].forEach(h => hd.append(el("th", {text:h})));
tb.append(el("thead", {}, hd));
const body = el("tbody");
A.forEach(a => { const tr = el("tr", a.launch === P.launch_utc ? {class:"sel"} : {});
  [a.window, a.launch, a.mars_arrival, a.mars_departure, a.earth_return, a.outbound_days, a.surface_days, a.return_days, a.total_days, a.deep_space_days, a.earth_entry_speed.toFixed(1)].forEach(v => tr.append(el("td", {text:v})));
  body.append(tr); });
tb.append(body);
sec3.append(el("div", {class:"card scroll", style:"margin-top:16px"}, tb));
app.append(sec3);

/* ---------- variants + assumptions ---------- */
const sec4 = el("section"), two = el("div", {class:"stack"});
const vt = el("table"), vh = el("tr");
["This window, other choices","Out d","Mars d","Back d","Total d","Leave Earth v∞","Leave Mars v∞"].forEach(h => vh.append(el("th", {text:h})));
vt.append(el("thead", {}, vh));
const vb = el("tbody");
P.variants_this_window.forEach(a => { const tr = el("tr", a.launch === P.launch_utc ? {class:"sel"} : {});
  [a.option, a.outbound_days, a.surface_days, a.return_days, a.total_days, a.earth_dep_vinf.toFixed(2), a.mars_dep_vinf.toFixed(2)].forEach(v => tr.append(el("td", {text:v}))); vb.append(tr); });
P.short_stay_direct_return_for_comparison.slice(0, 1).forEach(a => { const tr = el("tr");
  [`short stay ${a.stay_days} d, direct return`, P.outbound_days, a.stay_days, a.return_days, a.total_days, P.energy.earth_dep_vinf.toFixed(2), a.mars_dep_vinf.toFixed(2)].forEach(v => tr.append(el("td", {text:v}))); vb.append(tr); });
vt.append(vb);
const ss = P.short_stay_direct_return_for_comparison[0];
two.append(el("div", {class:"card scroll"}, el("h2", {text:"Other ways to fly this window"}), vt,
  el("p", {class:"note", style:"margin-top:16px", text:`v∞ in km/s (speed left over after escaping the planet: higher needs a bigger rocket). A short stay with a direct return would hit Earth's atmosphere at about ${ss ? ss.earth_entry_speed.toFixed(0) : "?"} km/s, far beyond any capsule; real short-stay plans swing past Venus instead and spend most of the mission in deep space.`})));
const ul = el("ul"); P.assumptions.forEach(a => ul.append(el("li", {class:"note", text:a})));
two.append(el("div", {class:"card"}, el("h2", {text:"How this was calculated"}), ul,
  el("p", {class:"note", text:`Landing site: ${P.landing_site.name}. ${P.landing_site.why}`}),
  el("p", {class:"note", text:`Mars season: landing at Ls ${P.mars_season.ls_at_landing.toFixed(0)}° (${P.mars_season.season_at_landing}), Mars Year ${P.mars_season.mars_year_at_landing}. Dust-storm season (Ls 180–360°) covers ${P.mars_season.dust_season_days_on_surface} days of the stay, from ${fmtDate(P.mars_season.dust_season_first)}.`}),
  el("p", {class:"note", text:"Computed by tools/mission_planner.py from JPL Horizons ephemerides."})));
sec4.append(two);
app.append(sec4);
</script>
